version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    image: chatwoot:development
    env_file: .env

  rails:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
      - sidekiq
    ports:
      - 3000:3000
    env_file: .env
    environment:
      - VITE_DEV_SERVER_HOST=vite
      - NODE_ENV=development
      - RAILS_ENV=development
      # Otimização de RAM: Node limite para o Rails container
      - NODE_OPTIONS=--max-old-space-size=4096
      # Otimização de RAM: Ruby Garbage Collector e Workers
      - WEB_CONCURRENCY=1
      - RAILS_MAX_THREADS=5
      - RUBY_GC_HEAP_GROWTH_FACTOR=1.1
      - RUBY_GC_MALLOC_LIMIT=40000000
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      default:
      evolution-net:
        aliases:
          - chatwoot.local

  sidekiq:
    <<: *base
    image: chatwoot-rails:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
      # Otimização de RAM: Ruby Garbage Collector para o Sidekiq
      - RUBY_GC_HEAP_GROWTH_FACTOR=1.1
      - RUBY_GC_MALLOC_LIMIT=40000000
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
    image: chatwoot-vite:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - "3036:3036"
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - RAILS_ENV=development
      # Otimização de RAM: Aplica o limite no compilador do frontend (Vite)
      - NODE_OPTIONS=--max-old-space-size=4096
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite dev

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres@1506

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis:/data/redis
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_chatwoot3
    restart: unless-stopped
    env_file: []
    depends_on:
      - redis
      - postgres
      - rails        # Corrigido de chatwoot para rails
    networks:
      - default      # Permite falar com rails/redis/postgres internos
      - evolution-net # Permite falar com serviços externos na rede evolution-net
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      WHATSAPP_IMPORT_HISTORY: "false"
      CHATWOOT_ENABLED: "true"
      SERVER_URL: http://evolution:8080
      DATABASE_PROVIDER: postgresql
      # Credenciais corrigidas para apontar para o container postgres interno
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@1506@postgres:5432/admin_evolution?schema=public
      DATABASE_URL: postgresql://postgres:postgres@1506@postgres:5432/admin_evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      AUTH_ENABLED: "true"
      AUTH_STRATEGY: apikey
      AUTHENTICATION_API_KEY: "ats@A2t00s7"
      LOG_LEVEL: debug
      CHATWOOT_ACCOUNT_ID: "1"
      CHATWOOT_SYNC_HISTORY: "false"

volumes:
  postgres:
    external: true
    name: chatwoot_postgres
  redis:
  packs:
  node_modules:
  cache:
  bundle:
  evolution_instances:

networks:
  evolution-net:
    external: true
    name: evolution-net
